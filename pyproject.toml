[project]
name = "search"
version = "0.1.0"
description = ""
authors = [{ name = "one-zero-eight" }]
urls = { homepage = "https://t.me/one_zero_eight" }
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "apscheduler>=3.11.2",
    "beanie>=1.30.0,<2.0.0",
    "beautifulsoup4>=4.14.3",
    "colorlog>=6.10.1",
    "cryptography>=48.0.0",
    "fastapi>=0.136.1",
    "fake-useragent>=2.2.0",
    "httpx>=0.27.2",
    "markdownify>=1.2.2",
    "minio>=7.2.20",
    "motor>=3.7.1",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.27",
    "pyyaml>=6.0.3",
    "requests>=2.33.1",
    "ruff>=0.15.12",
    "types-pyyaml>=6.0.12.20260408",
    "uvicorn>=0.46.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "sentencepiece>=0.2.1",
    "openai>=2.35.1",
    "gunicorn>=26.0.0",
    "unicorn>=2.1.4",
    "prek>=0.3.13",
    "joserfc>=1.6.5",
]

[dependency-groups]
ml = [
    "chonkie[all]>=1.6.0,<2",
    "einops>=0.8.2,<0.9",
    "lance>=1.2.1,<2",
    "pandas>=2.3.3,<3",
    "infinity-client>=0.0.76,<0.0.77",
    "lancedb>=0.24.3,<0.25",
    "pylance>=0.31.1,<0.32",
    "lingua-language-detector>=2.1.1",
]

[tool.uv]
default-groups = ["ml"]

[tool.ruff]
line-length = 120
lint.extend-select = ["I", "UP", "PL"]
lint.extend-ignore = ["PLC0415", "PLR"]
target-version = "py311"
