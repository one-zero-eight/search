<div data-bbox="543 40 561 55" data-label="Page-Header">6</div><div data-bbox="454 73 648 91" data-label="Section-Header"><h2><b>6. ОТЧЕТНОСТЬ</b></h2></div><div data-bbox="143 117 971 180" data-label="Text"><p>6.1. На основании соответствующих локальных актов, приказов и распоряжений, Центр может являться ответственным в рамках своей деятельности за подготовку и поддержку в актуальном состоянии информации, справок и отчетов.</p></div>
