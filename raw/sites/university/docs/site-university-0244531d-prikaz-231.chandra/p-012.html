<div data-bbox="531 35 559 50" data-label="Page-Header">10</div><div data-bbox="138 65 964 141" data-label="Text"><p>Для начисления баллов за индивидуальные достижения поступающий представляет документы, подтверждающие получение индивидуальных достижений – выходные данные опубликованной статьи. За индивидуальные достижения не может быть начислено более 40 баллов.</p></div>
