<div data-bbox="141 94 482 112" data-label="Section-Header"><h2><b>5. Заключительные положения</b></h2></div><div data-bbox="141 120 944 161" data-label="Text"><p>5.1. Настоящее положение, изменения и дополнения к нему утверждаются директором Университета.</p></div><div data-bbox="141 166 944 206" data-label="Text"><p>5.2. Изменения и дополнения в настоящее положение могут быть внесены Университетом по приказу директора Университета.</p></div>
